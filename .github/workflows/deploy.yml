name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths: 
      - '.github/workflows/deploy.yml'
      - 'iconfont/**'
      - 'template/**'
      - '电磁波/**'
      - '量子化学历史起源/**'


jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/configure-pages@v6
      
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      
      - uses: actions/deploy-pages@v5